name: E2E Full Suite

# The whole Playwright suite, not just @smoke. The PR gate (e2e.yml) deliberately
# runs a subset so it stays fast; this is the safety net that catches what the
# subset does not, on a schedule and on demand.
#
# Sharded so wall-clock stays flat as the suite grows. Each shard gets its own
# MySQL service and its own database, so shards never see each other's fixtures.
on:
  workflow_dispatch:
  schedule:
    # Twice a day (06:00 / 18:00 UTC). Not per-PR: the suite drives real browser
    # flows against a real database and the gate would stop being a gate.
    - cron: "0 6,18 * * *"

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: salevali_crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/salevali_crm_test"
      NEXTAUTH_SECRET: "ci-test-secret-not-for-production"
      NEXTAUTH_URL: "http://localhost:3000"
      SEED_ADMIN_EMAIL: "admin@example.com"
      SEED_ADMIN_PASSWORD: "ChangeMe123!"
      SEED_ADMIN_NAME: "SaleVali Marketing Admin"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "ChangeMe123!"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npx prisma db seed
      - run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - name: Run full suite (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
